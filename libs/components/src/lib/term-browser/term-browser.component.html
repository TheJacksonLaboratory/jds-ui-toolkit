<div class="tw-flex tw-items-center tw-justify-between tw-pb-3">
  <h2 class="jds-term-title tw-text-base tw-font-bold tw-leading-6">{{ title() }}</h2>
</div>

<p class="tw-sr-only" role="status" aria-live="polite">{{ status() }}</p>

<div class="jds-term-scroller tw-min-h-0 tw-flex-1" [class.tw-overflow-y-auto]="!loading()">
  @if (loading()) {
    <div class="tw-flex tw-h-full tw-items-center tw-justify-center">
      <p-progress-spinner
        [style]="{ width: '2.5rem', height: '2.5rem' }"
        [ariaLabel]="text().loading"
        strokeWidth="4" />
    </div>
  } @else if (rows().length) {
    <div role="tree" [attr.aria-label]="ariaLabel()" class="tw-flex tw-flex-col tw-gap-0.5">
      @for (row of rows(); track row.node.key) {
        <div
          class="jds-term-row tw-flex tw-cursor-pointer tw-items-start tw-gap-2 tw-py-1.5 tw-pr-4"
          role="treeitem"
          [attr.data-key]="row.node.key"
          [attr.aria-level]="row.level"
          [attr.aria-posinset]="row.posinset"
          [attr.aria-setsize]="row.setsize"
          [attr.aria-expanded]="row.expanded ?? null"
          [attr.aria-selected]="row.selected"
          [attr.aria-busy]="row.loading || null"
          [attr.tabindex]="tabindexOf(row)"
          [style.--jds-level]="row.level - 1"
          (click)="select(row)"
          (keydown)="onKeydown($event, row)">

          @if (row.expanded === undefined) {
            <span class="tw-h-5 tw-w-4 tw-shrink-0" aria-hidden="true"></span>
          } @else {
            <span
              class="jds-term-twisty tw-flex tw-h-5 tw-w-4 tw-shrink-0 tw-items-center tw-justify-center"
              aria-hidden="true"
              (click)="toggleRow(row); $event.stopPropagation()">
              @if (row.loading) {
                <i class="pi pi-spinner pi-spin tw-text-[10px]"></i>
              } @else {
                <i
                  class="pi pi-chevron-down tw-text-[10px] tw-transition-transform tw-duration-150"
                  [class.-tw-rotate-90]="!row.expanded"></i>
              }
            </span>
          }

          <span
            class="tw-group tw-min-w-0 tw-flex-1 tw-break-words tw-text-sm"
            [class.tw-font-bold]="row.selected">
            <span class="group-hover:tw-underline">{{ row.node.term.name }}</span
            ><span class="jds-term-count">{{ countOf(row.node.term) }}</span>
          </span>
        </div>
      }
    </div>
  } @else {
    <p class="jds-term-empty tw-text-sm">{{ text().empty }}</p>
  }
</div>
