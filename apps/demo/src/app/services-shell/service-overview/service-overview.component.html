@let d = doc();
@if (d) {
  <div class="tw-p-8 tw-max-w-4xl">
    <app-doc-overview></app-doc-overview>

    @for (example of d.usageExamples; track example.id) {
      <section [id]="example.id" class="tw-mt-12">
        <h2 class="tw-text-2xl tw-font-semibold tw-mb-2">{{ example.title }}</h2>
        <p class="tw-text-gray-700 tw-mb-4">{{ example.description }}</p>
        <pre class="tw-bg-gray-100 tw-p-4 tw-rounded tw-text-sm tw-overflow-auto"><code>{{ example.code }}</code></pre>
      </section>
    }

    <app-doc-usage></app-doc-usage>
    <app-doc-activity></app-doc-activity>
  </div>
}
