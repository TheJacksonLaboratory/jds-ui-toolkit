<div class="tw-flex tw-items-center tw-justify-between tw-pb-3">
  <h2 class="tw-font-bold tw-text-base tw-leading-6 tw-text-[#1e293b]">{{ title() }}</h2>
</div>

<p class="tw-sr-only" role="status" aria-live="polite">{{ status() }}</p>

<div class="jds-term-scroller tw-overflow-y-auto" [style.max-height]="maxHeight()">
  @if (rows().length) {
    <div role="tree" [attr.aria-label]="ariaLabel()" class="tw-flex tw-flex-col tw-gap-0.5">
      @for (row of rows(); track row.node.key) {
        <div
          class="jds-term-row tw-flex tw-cursor-pointer tw-items-center tw-gap-2 tw-rounded-md tw-py-1.5 tw-pr-4 focus-visible:tw-outline focus-visible:tw-outline-2 focus-visible:tw-outline-offset-[-2px] focus-visible:tw-outline-[#0177b2]"
          [class.tw-bg-[#94e1dc]]="row.selected"
          role="treeitem"
          [attr.data-key]="row.node.key"
          [attr.aria-level]="row.level"
          [attr.aria-posinset]="row.posinset"
          [attr.aria-setsize]="row.setsize"
          [attr.aria-expanded]="row.expanded ?? null"
          [attr.aria-selected]="row.selected"
          [attr.aria-busy]="row.loading || null"
          [attr.tabindex]="tabindexOf(row)"
          [style.--jds-level]="row.level - 1"
          (click)="select(row)"
          (keydown)="onKeydown($event, row)">

          @if (row.expanded === undefined) {
            <span class="tw-h-4 tw-w-4 tw-shrink-0" aria-hidden="true"></span>
          } @else {
            <span
              class="jds-term-twisty tw-flex tw-h-4 tw-w-4 tw-shrink-0 tw-items-center tw-justify-center"
              aria-hidden="true"
              (click)="toggleRow(row); $event.stopPropagation()">
              <i
                class="pi pi-chevron-down tw-text-[10px] tw-transition-transform tw-duration-150"
                [class.-tw-rotate-90]="!row.expanded"
                [class.tw-text-[#636363]]="!row.selected"
                [class.tw-text-[#16191d]]="row.selected"></i>
            </span>
          }

          <span
            class="tw-min-w-0 tw-flex-1 tw-truncate tw-text-sm hover:tw-underline"
            [class.tw-font-bold]="row.selected"
            [class.tw-text-[#16191d]]="row.selected"
            [class.tw-text-[#222222]]="!row.selected">
            {{ row.node.term.name }}<span
              class="tw-font-normal"
              [class.tw-text-[#454545]]="!row.selected">{{ countOf(row.node.term) }}</span>
          </span>
        </div>
      }
    </div>
  } @else {
    <p class="tw-text-sm tw-text-[#454545]">{{ text().empty }}</p>
  }
</div>
